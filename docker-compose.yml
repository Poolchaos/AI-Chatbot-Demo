services:
  app:
    build: .
    container_name: chatbot-demo-app
    ports:
      - "3006:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/elevate-offsites
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - DAILY_REQUEST_LIMIT=${DAILY_REQUEST_LIMIT:-100}
      - SESSION_MESSAGE_LIMIT=${SESSION_MESSAGE_LIMIT:-20}
      - NODE_ENV=production
      - DEMO_MODE=true
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-demo-net

  mongo:
    image: mongo:7
    container_name: chatbot-demo-mongo
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - chatbot_demo_mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - chatbot-demo-net

networks:
  chatbot-demo-net:
    driver: bridge

volumes:
  chatbot_demo_mongo_data:
